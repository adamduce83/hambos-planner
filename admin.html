<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hambo's Kitchen Designer · Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap">
<style>
  :root{--forest:#1e4a2f;--cta:#2f9e5b;--ink:#2a2f28;--line:#dfe3da;--paper:#f6f7f3;--sage:#566b4b;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);}
  header{background:var(--forest);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;min-height:64px;}
  header img{height:40px;} header .t{font-family:'Caveat',cursive;font-size:30px;} header .sub{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#cfe0d3;}
  header .sp{flex:1;} header a,header button{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;}
  main{max-width:1180px;margin:0 auto;padding:22px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
  h2{font-size:18px;margin:0 0 10px;} h1{font-size:22px;margin:0 0 6px;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;} .tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);} .tabs button.on{background:var(--forest);color:#fff;border-color:var(--forest);}
  input,textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sage);font-weight:700;margin:10px 0 4px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--forest);color:#fff;text-decoration:none;}
  .btn.alt{background:#e7ece1;color:var(--ink);} .btn.danger{background:#c9614b;} .btn.small{padding:6px 9px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;} th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sage);padding:8px 8px;border-bottom:2px solid var(--line);} td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:#f8faf5;} .muted{color:#6a7361;font-size:12px;} .files{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
  .files a{font-size:12px;background:#eef4ee;border:1px solid #cfe0d3;border-radius:6px;padding:4px 8px;color:var(--forest);text-decoration:none;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;} .note{font-size:13px;color:#6a7361;margin-top:8px;min-height:18px;}
  .pill{display:inline-block;font-size:11px;border-radius:10px;padding:2px 8px;background:#eef4ee;color:var(--forest);font-weight:700;} .pill.new{background:#fff3f0;color:#b3392a;}
  @media (max-width:820px){ main{padding:12px;} td,th{padding:8px 4px;} header .sub{display:none;} }
</style></head>
<body>
<header><img src="hambos-logo-white.svg" alt="Hambo's"><span class="t">Kitchen Designer</span><span class="sub">Admin</span><span class="sp"></span><a href="index.html">Open the designer</a><button id="btnOut" hidden>Sign out</button></header>
<main>
  <div class="card" id="gate">
    <h1>Staff sign in</h1>
    <p class="muted">Jobs, plan sheets and customer enquiries. Staff emails only.</p>
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Password</label><input id="pass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:12px;"><button class="btn" id="go">Sign in</button><button class="btn alt" id="link">Email me a sign-in link</button></div>
    <div class="note" id="gnote"></div>
  </div>
  <div id="app" hidden>
    <div class="tabs"><button class="on" data-v="jobs">Jobs</button><button data-v="enq">Enquiries <span class="pill new" id="enqCount" hidden>0</span></button></div>
    <div class="card" id="vJobs">
      <div class="row"><h2 style="margin:0;">Jobs</h2><span class="sp" style="flex:1"></span><input id="q" placeholder="Search order, customer, room…" style="max-width:320px;"></div>
      <div id="jobs"></div>
    </div>
    <div class="card" id="vEnq" hidden>
      <h2>Customer enquiries</h2><p class="muted">Designs sent from the "Get My Quote" button. Open one to see it in the designer, or save it as a job.</p>
      <div id="enq"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="cloud-config.js"></script>
<script>
const C=window.HAMBOS_CLOUD||{}; const sb=(window.supabase&&C.url&&C.anon)?supabase.createClient(C.url,C.anon):null;
const $=id=>document.getElementById(id); const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=iso=>{ const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('en-AU')+' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}); };
let user=null, staff=false, jobs=[], enqs=[];
async function refresh(){ if(!sb){ $('gnote').textContent='Cloud is not configured on this copy.'; return; } const {data:{session}}=await sb.auth.getSession(); user=session?session.user:null; staff=false;
  if(user){ const {data}=await sb.from('staff').select('email').limit(1); staff=!!(data&&data.length); }
  $('gate').hidden=staff; $('app').hidden=!staff; $('btnOut').hidden=!user;
  if(user&&!staff) $('gnote').textContent='Signed in as '+user.email+', but that email is not on the staff list.';
  if(staff) await loadAll(); }
if(sb) sb.auth.onAuthStateChange(()=>refresh());
$('go').onclick=async()=>{ $('gnote').textContent='Signing in…'; const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value}); if(error) $('gnote').textContent=error.message; else refresh(); };
$('link').onclick=async()=>{ const email=$('email').value.trim(); if(!email){ $('gnote').textContent='Type your email first.'; return; } const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}}); $('gnote').textContent=error?error.message:'Check your inbox and click the link.'; };
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); });
$('btnOut').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); $('vJobs').hidden=b.dataset.v!=='jobs'; $('vEnq').hidden=b.dataset.v!=='enq'; });
$('q').oninput=()=>renderJobs();
async function loadAll(){
  const j=await sb.from('jobs').select('id,order_ref,customer,rooms,updated_at,updated_by').order('updated_at',{ascending:false}).limit(500); jobs=j.data||[];
  const e=await sb.from('enquiries').select('id,created_at,name,phone,email,suburb,message,order_ref,customer,handled').order('created_at',{ascending:false}).limit(200); enqs=e.data||[];
  renderJobs(); renderEnq(); }
function renderJobs(){
  const q=$('q').value.trim().toLowerCase(); const list=jobs.filter(j=>!q||[j.order_ref,j.customer,j.rooms].join(' ').toLowerCase().includes(q));
  if(!list.length){ $('jobs').innerHTML='<p class="muted">No jobs yet. Anything saved in the designer while signed in appears here.</p>'; return; }
  $('jobs').innerHTML='<table><tr><th>Order / Ref</th><th>Customer</th><th>Rooms</th><th>Last saved</th><th></th></tr>'+list.map(j=>'<tr data-id="'+esc(j.id)+'"><td><b>'+esc(j.order_ref||'—')+'</b></td><td>'+esc(j.customer||'—')+'</td><td class="muted">'+esc(j.rooms||'')+'</td><td class="muted">'+when(j.updated_at)+(j.updated_by?'<br>'+esc(j.updated_by):'')+'</td><td><div class="row"><a class="btn small" href="index.html?job='+encodeURIComponent(j.id)+'">Open in designer</a><button class="btn small alt" data-files="'+esc(j.id)+'">Plan sheets</button><button class="btn small danger" data-del="'+esc(j.id)+'">Delete</button></div><div class="files" id="f-'+esc(j.id)+'"></div></td></tr>').join('')+'</table>';
  $('jobs').querySelectorAll('[data-files]').forEach(b=>b.onclick=()=>showFiles(b.dataset.files));
  $('jobs').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const j=jobs.find(x=>x.id===b.dataset.del); if(!confirm('Delete "'+(j.order_ref||j.customer)+'" from the cloud? Plan sheets stay in storage.')) return; await sb.from('jobs').delete().eq('id',b.dataset.del); loadAll(); });
}
async function showFiles(id){ const box=$('f-'+id); box.innerHTML='<span class="muted">Loading…</span>'; const {data,error}=await sb.storage.from('plans').list(id,{limit:100,sortBy:{column:'name',order:'asc'}}); if(error||!data||!data.length){ box.innerHTML='<span class="muted">No plan sheets saved yet. Open the job in the designer and use ⋯ → Save plan sheets to the cloud.</span>'; return; }
  const links=[]; for(const f of data){ const {data:s}=await sb.storage.from('plans').createSignedUrl(id+'/'+f.name,900); if(s) links.push('<a href="'+s.signedUrl+'" target="_blank" rel="noopener">'+esc(f.name)+'</a>'); } box.innerHTML=links.join('')||'<span class="muted">No files.</span>'; }
function renderEnq(){
  const open=enqs.filter(e=>!e.handled); $('enqCount').hidden=!open.length; $('enqCount').textContent=open.length;
  if(!enqs.length){ $('enq').innerHTML='<p class="muted">No enquiries yet.</p>'; return; }
  $('enq').innerHTML='<table><tr><th>When</th><th>Customer</th><th>Contact</th><th>Message</th><th></th></tr>'+enqs.map(e=>'<tr style="'+(e.handled?'opacity:.6':'')+'"><td class="muted">'+when(e.created_at)+(e.handled?'<br><span class="pill">handled</span>':'<br><span class="pill new">new</span>')+'</td><td><b>'+esc(e.name||e.customer||'—')+'</b><br><span class="muted">'+esc(e.suburb||'')+'</span></td><td>'+esc(e.phone||'')+'<br><span class="muted">'+esc(e.email||'')+'</span></td><td class="muted">'+esc(e.message||'')+'</td><td><div class="row"><button class="btn small" data-open="'+e.id+'">Open in designer</button><button class="btn small alt" data-done="'+e.id+'">'+(e.handled?'Mark new':'Mark handled')+'</button></div></td></tr>').join('')+'</table>';
  $('enq').querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{ const {data}=await sb.from('enquiries').select('state').eq('id',+b.dataset.open).maybeSingle(); if(!data) return; const st=data.state; const e=enqs.find(x=>x.id===+b.dataset.open); const id='enq'+e.id; st.jobId=id; if(!st.tb.tbCust) st.tb.tbCust=e.name||''; if(!st.tb.tbMobile) st.tb.tbMobile=e.phone||''; st.tb.tbNotes=[st.tb.tbNotes,'Enquiry from '+(e.name||'')+' '+(e.email||'')+' '+(e.suburb||'')+(e.message?': '+e.message:'')].filter(Boolean).join(' | ');
    await sb.from('jobs').upsert({id,order_ref:st.tb.tbJob||('Enquiry '+e.id),customer:st.tb.tbCust,rooms:(st.rooms||[]).map(r=>r.name+' ('+(r.cabs||[]).length+')').join(', '),state:st,updated_by:user.email}); location.href='index.html?job='+encodeURIComponent(id); });
  $('enq').querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{ const e=enqs.find(x=>x.id===+b.dataset.done); await sb.from('enquiries').update({handled:!e.handled}).eq('id',e.id); loadAll(); });
}
refresh();
</script>
</body></html>
